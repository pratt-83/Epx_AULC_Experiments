apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: epiplexity-transformer-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: rook-ceph-block

